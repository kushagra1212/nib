name: Release

# Tagging v0.1.0 builds the app, packages a DMG, and publishes a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple silicon runner: harper-ls and the app are arm64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Fetch harper-ls
        run: Scripts/fetch-harper.sh

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Generate icon
        run: |
          swift Scripts/make-icon.swift
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns

      - name: Bundle app
        run: Scripts/bundle.sh

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/make-dmg.sh

      - name: Checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="dist/nib-${VERSION}.dmg"
          echo "sha256=$(shasum -a 256 "$FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nib-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            brew install --cask kushagra1212/tap/nib
            ```

            Or download the DMG below and drag nib to Applications.

            **Installing the DMG by hand needs one extra step.** nib is not
            notarised, so macOS quarantines it and reports that it is damaged.
            Clear the flag after copying it across:

            ```sh
            xattr -cr /Applications/nib.app
            ```

            Homebrew does this for you, which is why it is the easier route.

            On first launch, approve nib in
            System Settings → Privacy & Security → Accessibility. It cannot
            read the text you are editing without that.

            `sha256: ${{ steps.checksum.outputs.sha256 }}`

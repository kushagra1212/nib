name: Release

# Tagging v0.1.0 builds the app, packages a DMG, and publishes a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple silicon runner: harper-ls and the app are arm64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Fetch harper-ls
        run: Scripts/fetch-harper.sh

      # Before the tests, not just before the bundle: one of them checks that
      # every library llama-server loads was actually vendored, and it can only
      # do that if the directory is there.
      - name: Fetch llama-server
        run: Scripts/fetch-llama.sh

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Generate icon
        run: |
          swift Scripts/make-icon.swift
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns

      - name: Bundle app
        run: Scripts/bundle.sh

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/make-dmg.sh

      - name: Checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="dist/nib-${VERSION}.dmg"
          echo "sha256=$(shasum -a 256 "$FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Publishing the DMG without this leaves `brew install` fetching the
      # previous release, and the failure is a sha256 mismatch on a stranger's
      # machine rather than anything visible here.
      #
      # Casks/nib.rb in this repo is the source. The copy in the tap is
      # generated, so any edit to the cask has to be made here.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning title=Tap not updated::TAP_TOKEN is unset, so"\
                 "kushagra1212/homebrew-tap still points at the previous"\
                 "release. brew install will fetch the old DMG."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/kushagra1212/homebrew-tap.git" tap

          mkdir -p tap/Casks
          sed -e "s|^  version .*|  version \"${VERSION}\"|" \
              -e "s|^  sha256 .*|  sha256 \"${SHA256}\"|" \
              Casks/nib.rb > tap/Casks/nib.rb

          # Confirm the substitution landed. A silent no-op here would publish
          # a cask still carrying the placeholder checksum.
          grep -q "version \"${VERSION}\"" tap/Casks/nib.rb
          grep -q "sha256 \"${SHA256}\"" tap/Casks/nib.rb

          cd tap
          if git diff --quiet; then
            echo "Tap already describes ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "nib ${VERSION}"
          git push -q
          echo "Tap updated to ${VERSION}."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nib-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            brew install --cask kushagra1212/tap/nib
            ```

            Or download the DMG below and drag nib to Applications.

            **Installing the DMG by hand needs one extra step.** nib is not
            notarised, so macOS quarantines it and reports that it is damaged.
            Clear the flag after copying it across:

            ```sh
            xattr -cr /Applications/nib.app
            ```

            Homebrew does this for you, which is why it is the easier route.

            On first launch, approve nib in
            System Settings → Privacy & Security → Accessibility. It cannot
            read the text you are editing without that.

            `sha256: ${{ steps.checksum.outputs.sha256 }}`

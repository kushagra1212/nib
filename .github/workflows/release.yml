name: Release

# Tagging v0.1.0 builds the app, packages a DMG, and publishes a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple silicon runner: harper-ls and the app are arm64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Fetch harper-ls
        run: Scripts/fetch-harper.sh

      # Before the tests, not just before the bundle: one of them checks that
      # every library llama-server loads was actually vendored, and it can only
      # do that if the directory is there.
      - name: Fetch llama-server
        run: Scripts/fetch-llama.sh

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Generate icon
        run: |
          swift Scripts/make-icon.swift
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns

      - name: Bundle app
        run: Scripts/bundle.sh

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/make-dmg.sh

      - name: Checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="dist/nib-${VERSION}.dmg"
          echo "sha256=$(shasum -a 256 "$FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly. Left to itself this action uses the ref that
          # triggered the run, which is the tag on a tag push but the branch
          # on a manual run -- so the recovery path, workflow_dispatch, would
          # publish a release called "main".
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/nib-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            brew install --cask kushagra1212/tap/nib
            xattr -dr com.apple.quarantine /Applications/nib.app
            ```

            Or download the DMG below, drag nib to Applications, and run that
            same second line.

            **It is not optional.** nib is not notarised, so Gatekeeper refuses
            to open it and offers only *Move to Trash* -- which deletes the app
            while Homebrew still records it as installed. The block applies to
            anything carrying the quarantine attribute, which a browser
            download and Homebrew both attach, and Homebrew 6 has no flag to
            skip it.

            On first launch, approve nib in
            System Settings → Privacy & Security → Accessibility. It cannot
            read the text you are editing without that.

            `sha256: ${{ steps.checksum.outputs.sha256 }}`

      # After the release, never before it.
      #
      # The cask points at the release's download URL, so updating the tap
      # first opens a window where `brew install` resolves to a file that has
      # not been uploaded yet -- a 404 on a stranger's machine. Running it
      # first also meant a bad token blocked the release itself: the DMG was
      # built, the step failed, and publishing was skipped.
      #
      # Failing here now leaves a complete release with the tap describing the
      # previous version, which still installs.
      #
      # Casks/nib.rb in this repo is the source. The copy in the tap is
      # generated, so any edit to the cask has to be made here.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::warning title=Tap not updated::TAP_TOKEN is unset, so"\
                 "kushagra1212/homebrew-tap still points at the previous"\
                 "release. brew install will fetch the old DMG."
            exit 0
          fi

          # Ask what the token can reach before using it. A bare git clone
          # answers "Permission denied", which reads as a broken secret when
          # the secret is fine and its scope is not -- and says nothing about
          # which of the two permissions is missing.
          REPO="https://api.github.com/repos/kushagra1212/homebrew-tap"
          BODY="$(curl -sS -H "Authorization: Bearer ${TAP_TOKEN}" "$REPO")"
          # tostring, rather than `jq -e` or `// "absent"`. Both of those treat
          # a false result the same as a missing one -- jq's // is the
          # alternative operator, which fires on false as well as null -- and a
          # read-only token would have been reported as a token that cannot see
          # the repository at all. Which is the wrong instruction to hand
          # someone, and the exact failure this check exists to prevent.
          PUSH="$(echo "$BODY" | jq -r '.permissions.push | tostring')"
          if [[ "$PUSH" == "null" ]]; then
            echo "::error title=Tap token cannot see the repository::TAP_TOKEN"\
                 "cannot read kushagra1212/homebrew-tap. GitHub replied:"\
                 "$(echo "$BODY" | jq -r '.message // "no message"'). A"\
                 "fine-grained token only reaches repositories listed on it, so"\
                 "add homebrew-tap under Repository access -- owning the"\
                 "repository is not the same as granting access to it."
            exit 1
          fi
          if [[ "$PUSH" != "true" ]]; then
            echo "::error title=Tap token is read-only::TAP_TOKEN can read"\
                 "kushagra1212/homebrew-tap but not write to it. Set"\
                 "Permissions -> Contents to 'Read and write'."
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/kushagra1212/homebrew-tap.git" tap

          mkdir -p tap/Casks
          # A banner first, so the copy cannot be mistaken for the original.
          # Without it the generated file opens with "this file is the source",
          # which is true where it was written and false where it lands.
          {
            printf '%s\n' \
              '# GENERATED FILE -- do not edit here.' \
              '#' \
              '# Written by the nib release workflow from Casks/nib.rb in' \
              '# kushagra1212/nib. Any change made in this repository is lost on the' \
              '# next release.' \
              '#'
            sed -e "s|^  version .*|  version \"${VERSION}\"|" \
                -e "s|^  sha256 .*|  sha256 \"${SHA256}\"|" \
                Casks/nib.rb
          } > tap/Casks/nib.rb

          # Confirm the substitution landed. A silent no-op here would publish
          # a cask still carrying the placeholder checksum.
          grep -q "version \"${VERSION}\"" tap/Casks/nib.rb
          grep -q "sha256 \"${SHA256}\"" tap/Casks/nib.rb

          cd tap
          if git diff --quiet; then
            echo "Tap already describes ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "nib ${VERSION}"
          git push -q
          echo "Tap updated to ${VERSION}."

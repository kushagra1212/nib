name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch harper-ls
        run: Scripts/fetch-harper.sh

      # Both binaries, and before the tests rather than before the packaging
      # step that needs them: one test walks otool over vendor/llama to check
      # that every library llama-server loads was fetched, and it skips itself
      # when the directory is absent. Fetching afterwards would leave that
      # test permanently skipped on CI, which is the one place it matters.
      - name: Fetch llama-server
        run: Scripts/fetch-llama.sh

      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      # Catches a broken bundle or icon script before a tag depends on them.
      - name: Package
        run: |
          swift Scripts/make-icon.swift
          iconutil -c icns Resources/AppIcon.iconset -o Resources/AppIcon.icns
          Scripts/bundle.sh
          Scripts/make-dmg.sh
